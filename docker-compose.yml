services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data        # SQLite 파일(data/app.db)을 컨테이너 밖에 보관
    environment:
      - DB_PATH=/app/data/app.db

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000/api
      - USE_MOCK=false
    depends_on:
      - backend
